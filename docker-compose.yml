# 로컬 개발 전용. 서버 배포용 docker-compose는 techtaurant-infra/dev/ 를 사용한다.
services:
  db:
    build:
      context: ./docker/postgres
    image: techtaurant/postgres-bigm:18-alpine
    container_name: techtaurant-postgres
    # shared_preload_libraries는 서버 시작 시점에만 읽히므로 실행 인자로 넘긴다.
    command: postgres -c shared_preload_libraries=pg_bigm
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      POSTGRES_DB: ${DB_NAME:-techtaurant}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - techtaurant_postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_NAME:-techtaurant}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techtaurant-app
    env_file: .env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  techtaurant_postgres_data:
    driver: local
